name: Package Builds

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: package-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        package: [extraction, frontend, learning, storage]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @flashlearn/${{ matrix.package }}

  build-cli-integration:
    name: Build CLI integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke test built CLI
        run: |
          node packages/cli/dist/index.js init
          test -f .flashlearn/cards.json
          test -f .flashlearn/review.json
          test -f .flashlearn/settings.json
