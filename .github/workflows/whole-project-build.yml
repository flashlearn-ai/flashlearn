name: Whole Project Build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: whole-project-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
