name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-scope:
    name: Only Edit One Package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check pull request package scope
        if: github.event_name == 'pull_request'
        run: node scripts/check-package-scope.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Check pushed package scope
        if: github.event_name == 'push'
        run: node scripts/check-package-scope.mjs "${{ github.event.before }}" "${{ github.sha }}"

  generated-content:
    name: No Generated Content
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check pull request for generated or confidential content
        if: github.event_name == 'pull_request'
        run: node scripts/check-generated-content.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Check pushed commits for generated or confidential content
        if: github.event_name == 'push'
        run: node scripts/check-generated-content.mjs "${{ github.event.before }}" "${{ github.sha }}"

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build static sample demo
        run: npm run build:demo --workspace @flashlearn/frontend
      - name: Install browser for frontend smoke tests
        run: npm exec --workspace @flashlearn/frontend -- playwright install --with-deps chromium
      - name: Test local UI and Pages demo
        run: npm run test:browser --workspace @flashlearn/frontend
      - name: Smoke test built CLI
        run: |
          project="$(mktemp -d)"
          node packages/cli/dist/index.js init "$project"
          test -f "$project/.flashlearn/cards.json"
          test -f "$project/.flashlearn/review.json"
          test -f "$project/.flashlearn/settings.json"
          node packages/cli/dist/index.js --help
