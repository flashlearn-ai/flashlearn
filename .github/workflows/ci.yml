name: CI

on:
  pull_request:
  # PR merges push a new commit to main; validate that resulting commit too.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-scope:
    name: Only Edit One Package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check pull request package scope
        if: github.event_name == 'pull_request'
        run: node scripts/check-package-scope.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Check pushed package scope
        if: github.event_name == 'push'
        run: node scripts/check-package-scope.mjs "${{ github.event.before }}" "${{ github.sha }}"

  generated-content:
    name: No Generated Content
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check pull request for generated or confidential content
        if: github.event_name == 'pull_request'
        run: node scripts/check-generated-content.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Check pushed commits for generated or confidential content
        if: github.event_name == 'push'
        run: node scripts/check-generated-content.mjs "${{ github.event.before }}" "${{ github.sha }}"

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke test built CLI
        run: |
          project="$(mktemp -d)"
          node packages/cli/dist/index.js init "$project"
          test -f "$project/.flashlearn/cards.json"
          test -f "$project/.flashlearn/review.json"
          test -f "$project/.flashlearn/settings.json"
          node packages/cli/dist/index.js --help
