name: Package Scope

on:
  pull_request:
  push:
    branches: [main]

jobs:
  one-package:
    name: Enforce one package per change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check pull request package scope
        if: github.event_name == 'pull_request'
        run: node scripts/check-package-scope.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Check pushed package scope
        if: github.event_name == 'push'
        run: node scripts/check-package-scope.mjs "${{ github.event.before }}" "${{ github.sha }}"
