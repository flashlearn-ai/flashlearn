name: Release artifacts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  npm-artifact:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:pack
      - run: npm run release:test
  pages-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/test-build-modes.mjs
      - run: npm run site:build -- --demo
        env:
          VITE_DECK_SOURCE: https://invalid.example/must-not-be-used
      - run: npm exec --workspace @flashlearn/frontend -- playwright install --with-deps chromium
      - run: npm run site:test
      - run: npm run test:browser:live --workspace @flashlearn/frontend
