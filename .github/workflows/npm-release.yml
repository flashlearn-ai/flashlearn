name: npm release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global npm@11.12.1
      - name: Check release tag and main ancestry
        run: |
          node scripts/check-release-event.mjs
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci
      - run: npm run release:check
      - name: Publish the tested tarball using npm OIDC
        run: node scripts/publish-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release
          path: |
            .release/flashlearn.tgz
            .release/artifact.json
  release-assets:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-release
          path: release-assets
      - name: Attach the verified npm artifact to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/flashlearn.tgz release-assets/artifact.json --clobber
